<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="readyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="100%" stop-color="#ea580c"/>
    </linearGradient>
    <filter id="glowReady" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glowActive" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="480" rx="16" fill="url(#bgGrad)"/>

  <!-- Title & Badges -->
  <g transform="translate(50, 48)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="28" font-weight="800" fill="#ffffff">TTS Broadcast Card</text>
    <text x="0" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#94a3b8">Zero-Script Lovelace Card for Home Assistant with Edge TTS &amp; Chime</text>
  </g>

  <!-- Card State 1: Ready / Idle -->
  <g transform="translate(50, 110)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">1. READY STATE (Idle)</text>
    <rect x="0" y="14" width="420" height="74" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
    
    <!-- Input box -->
    <circle cx="34" cy="51" r="14" fill="#334155" opacity="0.5"/>
    <!-- Chat icon -->
    <path d="M28 47h12c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2h-8l-4 3v-3h-0c-1.1 0-2-.9-2-2v-6c0-1.1.9-2 2-2z" fill="#94a3b8"/>
    <text x="56" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#64748b">Message...</text>

    <!-- Divider -->
    <line x1="260" y1="28" x2="260" y2="74" stroke="#334155" stroke-width="1.5"/>

    <!-- Send Button -->
    <circle cx="295" cy="51" r="18" fill="#0284c7" fill-opacity="0.2"/>
    <path d="M289 54v-6l8 3-8 3zm0-4v2l4-1-4-1z" fill="#38bdf8"/>
    <circle cx="307" cy="40" r="7" fill="#0284c7"/>
    <path d="M304 40l6-3-2 6-1-2-3-1z" fill="#ffffff"/>

    <text x="325" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#f8fafc">Broadcast</text>
    <text x="325" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Devialet Phantom</text>
  </g>

  <!-- Card State 2: Broadcasting -->
  <g transform="translate(530, 110)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#fb923c">2. BROADCASTING STATE (Pulse &amp; Waveform)</text>
    <rect x="0" y="14" width="420" height="74" rx="14" fill="#1e293b" stroke="#ea580c" stroke-width="2" filter="url(#glowActive)"/>
    
    <!-- Input box (Cleared) -->
    <circle cx="34" cy="51" r="14" fill="#334155" opacity="0.5"/>
    <path d="M28 47h12c1.1 0 2 .9 2 2v6c0 1.1-.9 2-2 2h-8l-4 3v-3h-0c-1.1 0-2-.9-2-2v-6c0-1.1.9-2 2-2z" fill="#94a3b8"/>
    <text x="56" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" fill="#475569">Message sent...</text>

    <!-- Divider -->
    <line x1="260" y1="28" x2="260" y2="74" stroke="#475569" stroke-width="1.5"/>

    <!-- Active Button -->
    <circle cx="295" cy="51" r="20" fill="#ea580c" fill-opacity="0.3"/>
    <circle cx="295" cy="51" r="17" fill="#ea580c" fill-opacity="0.5"/>
    <!-- Speaker icon -->
    <path d="M289 48v6h3l4 3v-12l-4 3h-3zm8 0a4 4 0 0 1 0 6v-1a3 3 0 0 0 0-4v-1z" fill="#fb923c"/>
    <circle cx="307" cy="40" r="7" fill="#ea580c"/>
    <!-- Waveform badge -->
    <path d="M304 40h1v2h-1zm2-2h1v6h-1zm2-3h1v10h-1zm2 3h1v4h-1z" fill="#ffffff"/>

    <text x="325" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fb923c">Broadcasting...</text>
    <text x="325" y="63" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#fdba74">Active</text>
  </g>

  <!-- Flow / Architecture Diagram at bottom -->
  <g transform="translate(50, 240)">
    <rect x="0" y="0" width="900" height="190" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="#e2e8f0">NATIVE ZERO-SCRIPT PIPELINE</text>

    <!-- Step 1: Input & Chime -->
    <g transform="translate(24, 52)">
      <rect x="0" y="0" width="190" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">1. Chime Notification</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Plays notification audio</text>
      <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">via media_player</text>
      <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Customizable URL/file</text>
    </g>

    <!-- Arrow 1 -->
    <path d="M222 107h24m-6-6l6 6-6 6" stroke="#475569" stroke-width="2" fill="none"/>

    <!-- Step 2: Buffer Delay -->
    <g transform="translate(254, 52)">
      <rect x="0" y="0" width="180" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">2. Speaker Transition</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Hardware clear delay</text>
      <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">(0.5s - 10.0s slider)</text>
      <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Prevents cut-off &amp; lag</text>
    </g>

    <!-- Arrow 2 -->
    <path d="M442 107h24m-6-6l6 6-6 6" stroke="#475569" stroke-width="2" fill="none"/>

    <!-- Step 3: Multi-language Voice Detection -->
    <g transform="translate(474, 52)">
      <rect x="0" y="0" width="200" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#a78bfa">3. Auto Voice Match</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Chinese (Xiaoxiao)</text>
      <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Jenny | Nanami | SunHi</text>
      <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">Edge TTS Neural Voices</text>
    </g>

    <!-- Arrow 3 -->
    <path d="M682 107h24m-6-6l6 6-6 6" stroke="#475569" stroke-width="2" fill="none"/>

    <!-- Step 4: TTS Execution & Watchdog -->
    <g transform="translate(714, 52)">
      <rect x="0" y="0" width="162" height="110" rx="10" fill="#1e293b" stroke="#334155"/>
      <text x="14" y="26" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#34d399">4. Speech Output</text>
      <text x="14" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Calls tts.speak</text>
      <text x="14" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">Real-time state sync</text>
      <text x="14" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10" fill="#64748b">16s safety watchdog</text>
    </g>
  </g>
</svg>
